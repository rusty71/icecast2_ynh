#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "icecast2"
name = "Icecast2"
description.en = "Streaming server for the Mopidy + Qobuz stack (MP3 and lossless FLAC mounts)"
description.fr = "Serveur de streaming pour la pile Mopidy + Qobuz (flux MP3 et FLAC lossless)"

version = "2.4.4~ynh2"

maintainers = ["rusty71"]

[upstream]
license = "GPL-2.0"
website = "https://icecast.org/"
admindoc = "https://icecast.org/docs/"
code = "https://gitlab.xiph.org/xiph/icecast-server"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "800M"
ram.build = "700M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/icecast"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    ask.en = "Password of the Icecast admin (and of the streaming source)"
    help.en = "The Mopidy app has to use the same password to publish on the mounts."
    type = "password"

    [install.expose_port]
    ask.en = "Open the streaming port on the server?"
    help.en = "When enabled, the listeners can connect directly to the port of the server instead of going through the nginx reverse proxy."
    type = "boolean"
    default = false

[resources]

    [resources.system_user]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8000

    [resources.apt]
    packages = [
        "icecast2",
        "ffmpeg",
    ]
