#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
# The player is served by Icecast itself, on its port, over plain HTTP.  The
# reverse proxy sends "upgrade-insecure-requests", so a player on this page
# would try to reach the stream over https, and the port has no certificate.
# The visitor is sent to the port instead.
location = __PATH__/ {
    return 302 https://__DOMAIN__:__PUBLIC_PORT__/;
}

location __PATH__/ {

    proxy_pass https://127.0.0.1:__PORT__/;
    # The certificate of Icecast is for the name of the domain, and the
    # proxy goes to the address of the server.
    proxy_ssl_verify off;
    client_max_body_size 0;
    chunked_transfer_encoding on;

    # Do not buffer: the streams are endless, and buffering them would
    # delay the audio (and break the timing of the players).
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;

    # A listener may stay connected for hours.
    proxy_read_timeout 604800;
    proxy_send_timeout 604800;

    # Set some standard reverse proxy headers. Icecast server currently ignores these,
    # but may support them in a future version so that access logs are more useful.
    proxy_set_header  Host              $host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
}
