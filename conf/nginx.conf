#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
# The landing page of the app: it links to the two streams.  It replaces the
# status page of Icecast, which is still there on the port of the server
# (http://<domain>:<port>/).
location = __PATH__/ {
    root /etc/icecast2;
    try_files /landing.html =404;
}

location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;
    client_max_body_size 0;
    chunked_transfer_encoding on;

    # Do not buffer: the streams are endless, and buffering them would
    # delay the audio (and break the timing of the players).
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;

    # A listener may stay connected for hours.
    proxy_read_timeout 604800;
    proxy_send_timeout 604800;

    # Set some standard reverse proxy headers. Icecast server currently ignores these,
    # but may support them in a future version so that access logs are more useful.
    proxy_set_header  Host              $host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto $scheme;
}
