version = "1.0"

[main]

    [main.streaming]
    name = "Streaming"

        [main.streaming.expose_port]
        ask.en = "Open the streaming port on the server?"
        ask.fr = "Ouvrir le port de streaming sur le serveur ?"
        help.en = "When enabled, the listeners can connect directly to the port of the server instead of going through the nginx reverse proxy."
        help.fr = "Quand c'est active, les auditeurs peuvent se connecter directement au port du serveur au lieu de passer par le reverse proxy nginx."
        type = "boolean"
        bind = "null"

        [main.streaming.password]
        ask.en = "Password of the Icecast admin (and of the streaming source)"
        ask.fr = "Mot de passe de l'administrateur Icecast (et de la source de streaming)"
        help.en = "The Mopidy app has to use the same password. Leave the field empty to keep the current one."
        help.fr = "L'application Mopidy doit utiliser le meme mot de passe. Laissez le champ vide pour garder l'actuel."
        type = "password"
        bind = "null"

    [main.actions]
    name = "Actions"

        [main.actions.restart]
        ask.en = "Restart Icecast"
        ask.fr = "Redemarrer Icecast"
        type = "button"
