<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streams</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    margin: 0 auto;
    max-width: 34rem;
    padding: 3rem 1.5rem;
  }
  h1 { font-size: 1.6rem; margin: 0 0 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid rgba(128, 128, 128, 0.35); padding: 0.9rem 0; }
  li:last-child { border-bottom: 1px solid rgba(128, 128, 128, 0.35); }
  a { font-size: 1.1rem; text-decoration: none; }
  a:hover { text-decoration: underline; }
  p { margin: 0.35rem 0 0; opacity: 0.75; font-size: 0.92rem; }
  code { font-size: 0.9em; }
</style>
</head>
<body>
<h1>Streams</h1>
<ul>
  <li>
    <a href="http://__DOMAIN__:__PORT__/low.mp3">Low resolution (MP3)</a>
    <p>MP3, 128 kbps, 48 kHz stereo &mdash; for mobile and slow connections.</p>
  </li>
  <li>
    <a href="http://__DOMAIN__:__PORT__/high.ogg">High resolution (Ogg FLAC)</a>
    <p>Lossless, up to 24-bit/96 kHz, straight from Qobuz.</p>
  </li>
</ul>
</body>
</html>
